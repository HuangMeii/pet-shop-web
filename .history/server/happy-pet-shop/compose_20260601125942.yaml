  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - happy-pet-shop-network

volumes:
  postgres_data:

networks:
  happy-pet-shop-network:
    driver: bridge
